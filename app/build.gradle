plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.craitrainer'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.craitrainer'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += ['tflite']
    }
}

dependencies {
    implementation 'com.google.ai.edge.litert:litert:1.4.0'
}
